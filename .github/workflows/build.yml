name: Build resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Resume.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Resume.tex
          latexmk_use_lualatex: false

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate Resume.txt
        run: pdftotext -layout Resume.pdf Resume.txt

      - name: Stage site
        run: |
          mkdir -p _site
          cp Resume.pdf Resume.txt _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>Nicolas Kassis — Résumé</title>
          <meta http-equiv="refresh" content="0; url=Resume.pdf">
          <p><a href="Resume.pdf">Resume.pdf</a> · <a href="Resume.txt">Resume.txt</a></p>
          HTML

      - name: Upload PDF+TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            Resume.pdf
            Resume.txt

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
