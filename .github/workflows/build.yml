name: Build resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended tex-gyre poppler-utils

      # clean first: checkout gives committed dist/general/ fresh mtimes,
      # so make would otherwise treat it as up to date.
      - name: Build all variants
        run: make clean && make

      # Only the general variant is published; tailored variants stay in the build artifact.
      - name: Stage site
        run: |
          mkdir -p _site
          cp dist/general/resume-nicolas-kassis.pdf _site/Resume.pdf
          cp dist/general/resume-nicolas-kassis.pdf _site/resume-nicolas-kassis.pdf
          cp dist/general/resume-nicolas-kassis.txt _site/Resume.txt
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>Nicolas Kassis — Résumé</title>
          <meta http-equiv="refresh" content="0; url=Resume.pdf">
          <p><a href="Resume.pdf">Resume.pdf</a> · <a href="resume-nicolas-kassis.pdf">resume-nicolas-kassis.pdf</a> · <a href="Resume.txt">Resume.txt</a></p>
          HTML

      - name: Upload build artifact (all variants)
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: dist/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
